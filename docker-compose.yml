version: '3.8'

services:
  cadzook-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cadzook_api_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=https://www.cadzook.com,https://cadzook.com,http://localhost:5174
      - API_PREFIX=/api/v1
    volumes:
      - ./server/data:/app/data

  cadzook-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cadzook_web_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - cadzook-backend
